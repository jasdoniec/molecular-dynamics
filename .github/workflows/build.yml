name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and test (${{ matrix.os-name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux native on Ubuntu
          - runner: ubuntu-latest
            os-name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          # Windows cross-compiled from Ubuntu (needs mingw linker)
          - runner: ubuntu-latest
            os-name: windows-x86_64
            target: x86_64-pc-windows-gnu # Switched to GNU target for easy Linux-to-Windows compilation
          # macOS ARM native on Apple Silicon
          - runner: macos-latest
            os-name: macos-arm64
            target: aarch64-apple-darwin
          # macOS Intel cross-compiled natively on Apple Silicon
          - runner: macos-latest
            os-name: macos-x86_64
            target: x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Windows cross-linker (Linux only)
        if: matrix.os-name == 'windows-x86_64'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Only run native host tests to prevent cross-compilation execution failures
      - name: Run tests
        if: matrix.os-name == 'linux-x86_64' || matrix.os-name == 'macos-arm64'
        run: cargo test --locked || cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary (Linux / macOS)
        if: runner.os != 'Windows' && matrix.os-name != 'windows-x86_64'
        run: tar -czf "molecular-dynamics-${{ matrix.os-name }}.tar.gz" -C "target/${{ matrix.target }}/release" molecular-dynamics

      - name: Package binary (Windows Cross-compiled)
        if: matrix.os-name == 'windows-x86_64'
        run: zip -j "molecular-dynamics-${{ matrix.os-name }}.zip" "target/${{ matrix.target }}/release/molecular-dynamics.exe"

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: molecular-dynamics-${{ matrix.os-name }}
          path: molecular-dynamics-${{ matrix.os-name }}.*
          if-no-files-found: error

  release:
    name: Publish release for the current version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: molecular-dynamics-*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PACKAGE: molecular-dynamics
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name==\"$PACKAGE\").version")"
          TAG="v$VERSION"
          SHORT_SHA="${SHA:0:7}"
          echo "Publishing release $TAG for commit $SHORT_SHA"
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --target "$SHA" \
            --latest \
            --title "$TAG ($SHORT_SHA)" \
            --notes "Automated build of version $VERSION from commit $SHORT_SHA. Binaries: Linux x86_64 (.tar.gz), Windows x86_64 (.zip), macOS arm64 (.tar.gz), macOS x86_64 (.tar.gz). While the version in Cargo.toml stays $VERSION, every push to main replaces this release. Bump the version to publish a new one."
