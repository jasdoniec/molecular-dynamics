name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one build at a time on main: newer pushes cancel older runs, which
# also prevents two runs from racing to replace a same-version release.
concurrency:
  group: build-main
  cancel-in-progress: true

# Required to create the release tag and release
permissions:
  contents: write

jobs:
  build:
    name: Build and test (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            os-name: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            os-name: macos-arm64
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf "molecular-dynamics-${{ matrix.os-name }}.tar.gz" -C "target/${{ matrix.target }}/release" molecular-dynamics

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/molecular-dynamics.exe" -DestinationPath "molecular-dynamics-${{ matrix.os-name }}.zip" -Force

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: molecular-dynamics-${{ matrix.os-name }}
          path: molecular-dynamics-${{ matrix.os-name }}.*
          if-no-files-found: error

  release:
    name: Publish release for the current version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (to read the version from Cargo.toml)
        uses: actions/checkout@v4

      - name: Install Rust toolchain (for cargo metadata)
        uses: dtolnay/rust-toolchain@stable

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: molecular-dynamics-*
          merge-multiple: true
          path: dist

      - name: Publish release (replaces any existing release of the same version)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PACKAGE: molecular-dynamics
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name==\"$PACKAGE\").version")"
          TAG="v$VERSION"
          SHORT_SHA="${SHA:0:7}"
          echo "Publishing release $TAG for commit $SHORT_SHA"
          # Rebuilds of the same version replace the previous release of that
          # version; a version bump leaves old releases untouched as history.
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --target "$SHA" \
            --latest \
            --title "$TAG ($SHORT_SHA)" \
            --notes "Automated build of version $VERSION from commit $SHORT_SHA. Binaries: Linux x86_64 (.tar.gz), Windows x86_64 (.zip), macOS arm64 (.tar.gz). While the version in Cargo.toml stays $VERSION, every push to main replaces this release. Bump the version to publish a new one."

      - name: Remove legacy rolling "latest" release from the old CI scheme
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
