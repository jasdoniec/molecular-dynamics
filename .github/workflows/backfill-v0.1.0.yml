name: Backfill v0.1.0 release

on:
  push:
    branches: [main]

# One-time workflow: the original v0.1.0 release was never published because
# its CI run failed on a transient Windows test flake. This rebuilds the last
# v0.1.0 commit and publishes the missing release. The file is removed again
# right after the backfill succeeds.

permissions:
  contents: write

jobs:
  build:
    name: Build v0.1.0 (${{ matrix.os-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            os-name: windows-x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            os-name: macos-arm64
            target: aarch64-apple-darwin

    steps:
      - name: Check out the v0.1.0 commit
        uses: actions/checkout@v4
        with:
          ref: 5e9dee580f5c78e361e090acb0e0e61347c2eca9

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # Tests are skipped: this exact commit already passed tests in the CI
      # run that built the old rolling release; only the release was missing.
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf "molecular-dynamics-${{ matrix.os-name }}.tar.gz" -C "target/${{ matrix.target }}/release" molecular-dynamics

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/molecular-dynamics.exe" -DestinationPath "molecular-dynamics-${{ matrix.os-name }}.zip" -Force

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: molecular-dynamics-${{ matrix.os-name }}
          path: molecular-dynamics-${{ matrix.os-name }}.*
          if-no-files-found: error

  release:
    name: Publish backfilled v0.1.0 release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: molecular-dynamics-*
          merge-multiple: true
          path: dist

      - name: Publish v0.1.0 release (keep v0.1.1 marked as Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          V010_SHA: 5e9dee580f5c78e361e090acb0e0e61347c2eca9
        run: |
          gh release delete v0.1.0 --repo "$REPO" --yes --cleanup-tag || true
          gh api "repos/$REPO/releases" \
            -f tag_name="v0.1.0" \
            -f target_commitish="$V010_SHA" \
            -f name="v0.1.0 (5e9dee5)" \
            -f body="Pre-CLI build (renderer + simulations) at commit 5e9dee5. Backfilled automatically: the original v0.1.0 release run failed on a transient Windows test flake, so this release was never published." \
            -F make_latest="false"
          gh release upload v0.1.0 dist/* --repo "$REPO" --clobber
